everyday_scenarios:
  - counting the till at closing time in a small shop
  - food truck after the lunch rush
  - weekend farmers market or flea market stall
  - barber or salon chair-rental cash at end of shift
  - mechanic or tradesperson paid in cash for a job
  - freelancer taking cash deposits for gigs
  - splitting household cash between joint and personal accounts
  - envelope-budgeting groceries with cash at the kitchen table
  - garage-sale takings on a Saturday afternoon
  - checking a cash float before opening a stall
  - babysitter or tutor paid in cash and keeping a record
  - tip jar at a coffee shop at the end of the day
